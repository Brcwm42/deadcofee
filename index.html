    /**

     * ============================================================================
     */
    function Gallery() {
      const [selectedIndex, setSelectedIndex] = useState(null);

      useEffect(() => {
        if (selectedIndex === null) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') setSelectedIndex(null);
          if (e.key === 'ArrowRight') {
            setSelectedIndex((prev) => (prev + 1) % GALLERY_ITEMS.length);
          }
          if (e.key === 'ArrowLeft') {
            setSelectedIndex((prev) => (prev - 1 + GALLERY_ITEMS.length) % GALLERY_ITEMS.length);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedIndex]);

      const currentItem = selectedIndex !== null ? GALLERY_ITEMS[selectedIndex] : null;

      return (
        <section id="gallery" className="py-20 px-4 sm:px-6 bg-[#181412] border-y border-[#362E29]/60">

                  className="group text-left rounded-2xl overflow-hidden bg-[#1E1916] border border-[#362E29] hover:border-[#D4A373]/60 transition-all focus:outline-none focus:ring-2 focus:ring-[#D4A373]"

                      {photo.category}

                    <span className="absolute bottom-3 right-3 px-2.5 py-1 rounded-md bg-[#14110F]/80 text-xs text-[#F5EFEA] opacity-0 group-hover:opacity-100 transition-opacity">
                      點擊放大
                    </span>
                  </div>
                  <div className="p-4">
                    <h3 className="text-base font-serif font-semibold text-[#F5EFEA] group-hover:text-[#D4A373] transition-colors">
                      {photo.title}
                    </h3>
                    <p className="text-xs text-[#B8ACA2] mt-1 line-clamp-2 leading-relaxed">
                      {photo.caption}
                    </p>
                  </div>
                </button>
              ))}
            </div>
          </div>

          {currentItem && (
            <div

              aria-modal="true"
              aria-label={currentItem.title}

            >
              <div
                className="relative max-w-4xl w-full bg-[#1E1916] border border-[#362E29] rounded-2xl overflow-hidden shadow-2xl"

                >
                  ✕
                </button>

                <div className="relative aspect-[4/3] max-h-[65vh] w-full bg-[#14110F] flex items-center justify-center">
                  <img
                    src={currentItem.src}
                    alt={currentItem.alt}
                    onError={(e) => {
                      e.currentTarget.src = currentItem.fallback;
                    }}
                    className="w-full h-full object-contain"
                  />

                  <button
                    type="button"

    /**
     * ============================================================================
     * 6. ReservationForm 互動訂位表單元件
     * ============================================================================
     */
    function ReservationForm() {
      const todayStr = new Date().toISOString().split('T')[0];

      const [formData, setFormData] = useState({
        name: '',
        contact: '',
        date: todayStr,
        time: '19:30',
        guests: '2',
        zone: '一樓｜微光交流區（可輕聲交談）',
        childSeat: false,
        notes: '',
      });

      const [errors, setErrors] = useState({});
      const [submittedSummary, setSubmittedSummary] = useState(null);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value,
        }));
        if (errors[name]) {
          setErrors((prev) => ({ ...prev, [name]: '' }));
        }
      };

      const validate = () => {
        const newErrors = {};
        if (!formData.name.trim()) newErrors.name = '請填寫訂位人姓名';
        if (!formData.contact.trim()) newErrors.contact = '請填寫手機號碼或 Email 聯絡方式';
        if (!formData.date) {
          newErrors.date = '請選擇用餐日期';
        } else if (formData.date < todayStr) {
          newErrors.date = '訂位日期不可選擇過去的時間';
        }
        if (!formData.time) newErrors.time = '請選擇預計抵達時間';
        if (!formData.guests || Number(formData.guests) < 1) {
          newErrors.guests = '請選擇正確的用餐人數';
        }
        return newErrors;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate();
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }
        setSubmittedSummary({ ...formData });
      };

      return (
        <section id="reservation" className="py-20 px-4 sm:px-6 bg-[#14110F]">
          <div className="max-w-3xl mx-auto">
            <div className="text-center mb-10">
              <span className="text-xs tracking-[0.25em] text-[#D4A373] uppercase">
                ONLINE RESERVATION
              </span>
              <h2 className="text-2xl sm:text-4xl font-serif font-bold text-[#F5EFEA] mt-2">
                線上預約座位
              </h2>
              <p className="text-sm sm:text-base text-[#B8ACA2] mt-3">
                請依您的需求選擇「一樓交流區」或「二樓靜謐專注區」，訂位為您保留 10 分鐘
              </p>
            </div>

            <div className="mb-6 p-4 rounded-xl bg-amber-950/40 border border-[#D4A373]/40 text-xs sm:text-sm text-[#E5B889] flex items-start gap-3">
              <span className="font-bold shrink-0 mt-0.5">※ 展示聲明：</span>
              <span>
                此為前端網頁設計課程之「課堂展示表單」，僅供互動功能與資料驗證呈現，並非真實商業訂位系統。
              </span>
            </div>

            {submittedSummary ? (
              <div className="p-6 sm:p-8 rounded-2xl bg-[#1E1916] border border-[#D4A373]/60 shadow-xl">
                <div className="flex items-center gap-3 text-[#D4A373] mb-4">
                  <span className="w-8 h-8 rounded-full bg-[#D4A373]/20 flex items-center justify-center font-bold">
                    ✓
                  </span>
                  <h3 className="text-xl font-serif font-bold text-[#F5EFEA]">
                    已收到您的訂位資訊（展示模擬成功）
                  </h3>
                </div>
                <p className="text-sm text-[#B8ACA2] mb-6">
                  感謝您預約微光所，以下為您本次填寫的訂位摘要，請於預約時間準時抵達：
                </p>

                <div className="p-5 rounded-xl bg-[#14110F] border border-[#362E29] space-y-3 text-sm">
                  <div className="flex justify-between border-b border-[#362E29]/60 pb-2">
                    <span className="text-[#B8ACA2]">訂位大名</span>

                  <div className="flex justify-between border-b border-[#362E29]/60 pb-2">

                      name="name"
                      type="text"
                      placeholder="例如：林小姐 / 王先生"
                      value={formData.name}
                      onChange={handleChange}
                      className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] placeholder-[#B8ACA2]/50 focus:outline-none focus:border-[#D4A373]"
                    />
                    {errors.name && <p className="text-xs text-rose-400 mt-1">{errors.name}</p>}
                  </div>

                  <div>
                    <label htmlFor="res-contact" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                      聯絡電話或 Email <span className="text-[#D4A373]">*</span>
                    </label>
                    <input
                      id="res-contact"
                      name="contact"
                      type="text"
                      placeholder="0912-345-678"
                      value={formData.contact}
                      onChange={handleChange}
                      className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] placeholder-[#B8ACA2]/50 focus:outline-none focus:border-[#D4A373]"
                    />
                    {errors.contact && <p className="text-xs text-rose-400 mt-1">{errors.contact}</p>}
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                  <div>
                    <label htmlFor="res-date" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                      用餐日期 <span className="text-[#D4A373]">*</span>
                    </label>
                    <input
                      id="res-date"
                      name="date"
                      type="date"
                      min={todayStr}
                      value={formData.date}
                      onChange={handleChange}
                      className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] focus:outline-none focus:border-[#D4A373]"
                    />
                    {errors.date && <p className="text-xs text-rose-400 mt-1">{errors.date}</p>}
                  </div>

                  <div>
                    <label htmlFor="res-time" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                      預約時段 <span className="text-[#D4A373]">*</span>
                    </label>
                    <select
                      id="res-time"
                      name="time"
                      value={formData.time}
                      onChange={handleChange}
                      className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] focus:outline-none focus:border-[#D4A373]"
                    >
                      <option value="14:30">14:30（午後暖陽）</option>
                      <option value="16:30">16:30（傍晚茶點）</option>
                      <option value="19:30">19:30（夜間微光）</option>
                      <option value="21:00">21:00（深夜專注）</option>
                      <option value="22:30">22:30（夜貓靜謐）</option>
                    </select>
                    {errors.time && <p className="text-xs text-rose-400 mt-1">{errors.time}</p>}
                  </div>

                  <div>
                    <label htmlFor="res-guests" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                      用餐人數 <span className="text-[#D4A373]">*</span>
                    </label>
                    <select
                      id="res-guests"
                      name="guests"
                      value={formData.guests}
                      onChange={handleChange}
                      className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] focus:outline-none focus:border-[#D4A373]"
                    >
                      <option value="1">1 位（獨處／工作）</option>
                      <option value="2">2 位</option>
                      <option value="3">3 位</option>
                      <option value="4">4 位（限一樓交流區）</option>
                    </select>
                    {errors.guests && <p className="text-xs text-rose-400 mt-1">{errors.guests}</p>}
                  </div>
                </div>

                <div>
                  <label htmlFor="res-zone" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                    座位區域偏好（選填）
                  </label>
                  <select
                    id="res-zone"
                    name="zone"
                    value={formData.zone}
                    onChange={handleChange}
                    className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] focus:outline-none focus:border-[#D4A373]"
                  >
                    <option value="一樓｜微光交流區（可輕聲交談）">
                      一樓｜微光交流區（適合朋友小聚、可輕聲交談）
                    </option>
                    <option value="二樓｜靜謐專注區（禁止交談、附插座桌燈）">
                      二樓｜靜謐專注區（禁止交談與通話、附獨立插座與閱讀燈）
                    </option>
                  </select>
                </div>

                <div className="flex items-center gap-3 pt-1">
                  <input
                    id="res-childSeat"
                    name="childSeat"
                    type="checkbox"
                    checked={formData.childSeat}
                    onChange={handleChange}
                    className="w-4 h-4 rounded accent-[#D4A373]"
                  />
                  <label htmlFor="res-childSeat" className="text-sm text-[#B8ACA2]">
                    需要兒童座椅（僅提供於一樓交流區）
                  </label>
                </div>

                <div>
                  <label htmlFor="res-notes" className="block text-sm font-medium text-[#F5EFEA] mb-1.5">
                    特殊需求或備註（選填）
                  </label>
                  <textarea
                    id="res-notes"
                    name="notes"
                    rows="3"
                    placeholder="例如：希望靠近插座、餐點過敏原提醒等..."
                    value={formData.notes}
                    onChange={handleChange}
                    className="w-full px-4 py-3 rounded-xl bg-[#14110F] border border-[#362E29] text-[#F5EFEA] placeholder-[#B8ACA2]/50 focus:outline-none focus:border-[#D4A373]"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-[#D4A373] text-[#14110F] font-semibold text-base hover:bg-[#E5B889] transition-colors shadow-lg shadow-[#D4A373]/15"
                >
                  確認送出訂位申請
                </button>
              </form>
            )}
          </div>
        </section>
      );
    }

    /**
     * ============================================================================
     * 7. LocationSection 地圖與營業資訊元件
     * ============================================================================
     */
    function LocationSection() {
      return (
        <section id="contact" className="py-20 px-4 sm:px-6 bg-[#181412] border-t border-[#362E29]/60">
          <div className="max-w-6xl mx-auto">
            <div className="text-center max-w-2xl mx-auto mb-12">
              <span className="text-xs tracking-[0.25em] text-[#D4A373] uppercase">
                LOCATION &amp; HOURS
              </span>
              <h2 className="text-2xl sm:text-4xl font-serif font-bold text-[#F5EFEA] mt-2">
                營業資訊與巷弄指引
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch">
              <div className="lg:col-span-5 p-6 sm:p-8 rounded-2xl bg-[#1E1916] border border-[#362E29] flex flex-col justify-between space-y-6">
                <div className="space-y-4">
                  <div>
                    <h3 className="text-xl font-serif font-bold text-[#F5EFEA]">
                      {STORE_INFO.name} {STORE_INFO.englishName}
                    </h3>
                    <p className="text-xs text-[#D4A373] mt-1">{STORE_INFO.tagline}</p>
                  </div>

                  <div className="space-y-3 text-sm border-t border-[#362E29] pt-4">
                    <div>
                      <span className="block text-xs text-[#D4A373] mb-0.5">店鋪地址</span>
                      <p className="text-[#F5EFEA]">{STORE_INFO.address}</p>
                    </div>
                    <div>
                      <span className="block text-xs text-[#D4A373] mb-0.5">營業時間與公休</span>
                      <p className="text-[#F5EFEA]">{STORE_INFO.hours}</p>
                      <p className="text-[#B8ACA2] text-xs mt-0.5">{STORE_INFO.closedDay}</p>
                    </div>
                    <div>
                      <span className="block text-xs text-[#D4A373] mb-0.5">聯絡電話與信箱</span>
                      <p className="text-[#F5EFEA]">
                        {STORE_INFO.phone} ｜ {STORE_INFO.email}
                      </p>
                    </div>
                    <div>
                      <span className="block text-xs text-[#D4A373] mb-0.5">大眾運輸與停車資訊</span>
                      <p className="text-[#B8ACA2] text-xs leading-relaxed">{STORE_INFO.transport}</p>
                      <p className="text-[#B8ACA2] text-xs leading-relaxed mt-1">{STORE_INFO.parking}</p>
                    </div>
                    <div>
                      <span className="block text-xs text-[#D4A373] mb-0.5">低消與座位規範</span>
                      <p className="text-[#B8ACA2] text-xs leading-relaxed">{STORE_INFO.rules}</p>
                    </div>
                  </div>
                </div>

                <a
                  href={STORE_INFO.googleMapsUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full py-3 px-4 rounded-xl bg-[#D4A373] text-[#14110F] font-semibold text-sm text-center hover:bg-[#E5B889] transition-colors flex items-center justify-center gap-2"
                >
                  <span>在 Google Maps 中開啟導航</span>
                  <span aria-hidden="true">↗</span>
                </a>
              </div>

              <div className="lg:col-span-7 rounded-2xl overflow-hidden bg-[#1E1916] border border-[#362E29] flex flex-col">
                <div className="w-full h-[320px] sm:h-[400px] lg:h-full min-h-[320px]">
                  <iframe
                    title="微光所 Glimmer Room Google 地圖位置"
                    src={STORE_INFO.googleMapsEmbedUrl}
                    className="w-full h-full border-0"
                    loading="lazy"
                    referrerPolicy="no-referrer-when-downgrade"
                  />
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /**
     * ============================================================================
     * 8. Footer 頁尾元件
     * ============================================================================
     */
    function Footer() {
      return (
        <footer className="py-10 px-4 sm:px-6 bg-[#14110F] border-t border-[#362E29] text-center">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-[#B8ACA2]">
            <div>
              <span className="font-serif text-sm text-[#F5EFEA] font-semibold">
                {STORE_INFO.name} {STORE_INFO.englishName}
              </span>
              <span className="mx-2 text-[#362E29]">|</span>
              <span>{STORE_INFO.address}</span>
            </div>
            <div className="flex items-center gap-4">
              <span>Instagram: {STORE_INFO.instagram}</span>
              <span className="text-[#362E29]">|</span>
              <span>© {new Date().getFullYear()} Glimmer Room. 課堂網頁設計作品展示</span>
            </div>
          </div>
        </footer>
      );
    }

    /**
     * ============================================================================
     * 主應用程式入口 (App Component)
     * ============================================================================
     */
    function App() {
      return (
        <div className="min-h-screen">
          <Navbar />
          <main>
            <HeroSection />
            <AboutSection />
            <MenuSection />
            <Gallery />
            <ReservationForm />
            <LocationSection />
          </main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
